[package]
name = "Markpad"
version = "2.8.3"
description = "Simple Markdown viewer and text editor"
authors = ["Alec Ames <dev@alecames.com>"]
license = "BSD-3-Clause"
edition = "2021"

[[bin]]
name = "Markpad"
path = "src/main.rs"

[lib]
name = "markpad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }
cc = "1"

[dependencies]
tauri = { version = "2", features = ["protocol-asset", "devtools", "unstable"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = ">=2.2.2, <3"
serde = { version = "1", features = ["derive"] }
comrak = "0.54"
serde_json = "1"
tauri-plugin-prevent-default = "2"
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-connector = { version = "0.12", features = ["xcap"], optional = true }
notify = "8"
regex = "1"
# For the `asset:` protocol handler in `asset_protocol`. All three are already
# in the lock file as transitive dependencies of tauri, so naming them here
# adds no crate to the build.
http = "1"
http-range = "0.1"
percent-encoding = "2"
tauri-utils = "2"

reqwest = "0.13"
zip = { version = "2.1", default-features = false, features = ["deflate", "time"] }
directories = "5"
opener = { version = "0.7", features = ["reveal"] }
chrono = "0.4"
env_logger = "0.11.8"
font-kit = "0.14"
base64 = "0.22"
arboard = { version = "3", features = ["wayland-data-control"] }
image = { version = "0.25", default-features = false, features = ["png"] }
chardetng = "1"
encoding_rs = "0.8"


# Tree-sitter for syntax highlighting (built from source)
tree-sitter = "0.25"
tree-sitter-language = "0.1"
tree-sitter-highlight = "0.25"
lazy_static = "1.4"
phf = { version = "0.11", features = ["macros"] }

# Embed queries files into binary for single-exe distribution
include_dir = "0.7"

# Diagram rendering libraries (pure Rust)
layout-rs = "0.1"
svgbob = "0.7"

# PDF generation
lopdf = "0.34"

[target.'cfg(windows)'.dependencies]
winreg = "0.55"
webview2-com = "0.39.1"
windows = "0.62.2"

[features]
dev-connector = ["dep:tauri-plugin-connector"]

[profile.release]
panic = "abort" # Strip expensive panic clean-up logic
codegen-units = 1 # Compile crates one after another so the compiler can optimize better
lto = true # Enables link to optimizations
opt-level = "s" # Optimize for binary size
strip = true # Remove debug symbols
